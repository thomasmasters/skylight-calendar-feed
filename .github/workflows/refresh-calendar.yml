name: Refresh calendar feed

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub Actions queue delays.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-calendar-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test calendar filtering
        run: python -m unittest discover -s tests -v

      - name: Refresh and validate feed
        env:
          OUTLOOK_ICS_URL: ${{ secrets.OUTLOOK_ICS_URL }}
        run: |
          python scripts/refresh_calendar.py
          python scripts/refresh_calendar.py --check

      - name: Publish only when the feed changed
        run: |
          if ! git status --porcelain -- docs/filtered-calendar.ics data/uid-map.json | grep -q .; then
            echo "Calendar is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/filtered-calendar.ics data/uid-map.json
          git commit -m "Refresh filtered Outlook calendar"
          git push
