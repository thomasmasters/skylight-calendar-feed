name: Refresh Skylight calendar feed

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-skylight-calendar
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test location filtering
        run: python -m unittest discover -s tests

      - name: Download and filter Outlook calendar
        env:
          OUTLOOK_ICS_URL: ${{ secrets.OUTLOOK_ICS_URL }}
        run: python scripts/refresh_calendar.py

      - name: Publish changes
        run: |
          if git diff --quiet -- docs/filtered-calendar.ics; then
            echo "Calendar has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/filtered-calendar.ics
          git commit -m "Refresh filtered Outlook calendar"
          git push
